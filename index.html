<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>汽車儀表板</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  :root{
    --acc1:#4fa3ff;--acc2:#3ad17a;
    --pod-border:rgba(255,255,255,.10);--pod-glow:0 18px 60px rgba(0,0,0,.65);
    --spd-weight:200;--spd-style:normal;--spd-glow:none;
    --track:#20242c;--txt-sub:#8a93a3;
  }
  body.sport{
    --acc1:#ff2d2d;--acc2:#ff9500;
    --pod-border:rgba(255,45,45,.45);
    --pod-glow:0 0 46px rgba(255,45,45,.34),0 0 120px rgba(255,60,0,.16),0 18px 60px rgba(0,0,0,.65);
    --spd-weight:800;--spd-style:italic;
    --spd-glow:0 0 18px rgba(255,45,45,.85),0 0 46px rgba(255,90,0,.5),0 2px 4px rgba(0,0,0,.8);
    --track:#2a1216;--txt-sub:#d07a7a;
  }
  html,body{height:100%;background:#000;color:#fff;font-family:"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;}

  /* ── 全螢幕地圖（超出視窗的正方形，才能整張旋轉做「車頭朝上」） ── */
  #mapWrap{position:fixed;inset:0;overflow:hidden;z-index:0;background:#0a0a0a;}
  #map{position:absolute;inset:0;width:100%;height:100%;}
  /* MapLibre 原生支援旋轉(車頭朝上=bearing)與傾斜(3D=pitch)，不需要 CSS 假旋轉/透視 */
  .maplibregl-canvas{outline:none;}
  .maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important;}
  #mapMsg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#666;font-size:13px;text-align:center;line-height:1.8;padding:20px;z-index:1;}
  /* 右側垂直控制列（避開左上導航卡遮擋）：縮放/風格/3D/車頭朝上/車標 */
  #mapCtrls{position:fixed;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    z-index:1000;display:flex;flex-direction:column;gap:9px;align-items:flex-end;}
  .ctrl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;letter-spacing:.5px;color:#ddd;border:none;border-radius:13px;}
  .ctrl:active{background:#2c2c30;}
  .ctrl.on{color:#fff;border:1px solid var(--acc1);}
  body.sport .ctrl.on{border-color:#ff2d2d;box-shadow:0 0 10px rgba(255,45,45,.3);}
  #tiltBtn{font-size:14px;}
  #zoomBtns{display:flex;flex-direction:column;overflow:hidden;border-radius:13px;}
  #zoomBtns button{background:none;border:none;color:#ddd;font-size:20px;width:44px;height:38px;font-weight:600;}
  #zoomBtns button:first-child{border-bottom:1px solid #2a2a2e;}
  #zoomBtns button:active{background:#2c2c30;}
  /* 風格 / 車標選單：從控制列往左側展開 */
  #layerPanel,#iconPanel{position:fixed;right:64px;top:50%;transform:translateY(-50%);z-index:1100;
    display:none;flex-direction:column;padding:6px;border-radius:14px;min-width:148px;max-height:80vh;overflow:auto;}
  #layerPanel.open,#iconPanel.open{display:flex;}
  #layerPanel button,#iconPanel button{background:none;border:none;color:#ddd;text-align:left;padding:9px 12px;border-radius:9px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:9px;}
  #layerPanel button.act,#iconPanel button.act{background:var(--acc1);color:#fff;}
  body.sport #layerPanel button.act,body.sport #iconPanel button.act{background:#ff2d2d;}
  #layerPanel button:active,#iconPanel button:active{background:#2c2c30;}
  #carColors{display:flex;flex-wrap:wrap;gap:8px;padding:9px 8px 5px;margin-top:5px;border-top:1px solid rgba(255,255,255,.14);}
  #carColors .clbl{width:100%;font-size:11px;color:#9aa2b0;padding:0 2px 2px;}
  #iconPanel #carColors button{width:24px;height:24px;min-width:24px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:block;}
  #iconPanel #carColors button.act{border-color:#fff;box-shadow:0 0 0 2px var(--acc1);}
  body.sport #iconPanel #carColors button.act{box-shadow:0 0 0 2px #ff2d2d;}

  /* sport 全畫面紅色氛圍 */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:500;opacity:0;transition:opacity .6s;
    background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(255,30,30,.16) 100%);}
  body.sport #vignette{opacity:1;}
  body.sport #vignette::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(-55deg,rgba(255,45,45,.035) 0 2px,transparent 2px 30px);}

  /* ── 頂部懸浮列 ── */
  .pill{background:rgba(14,14,16,.82);border:1px solid #2a2a2e;border-radius:14px;backdrop-filter:blur(8px);}
  #topLeft{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:1000;display:flex;gap:8px;align-items:center;}
  #clock{font-size:15px;font-weight:600;padding:8px 14px;font-variant-numeric:tabular-nums;}
  #statusPill{display:flex;align-items:center;gap:7px;font-size:12px;color:#9a9a9a;padding:9px 13px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#444;}
  .dot.on{background:#3ad17a;box-shadow:0 0 8px #3ad17a;}
  .dot.err{background:#ff5050;}
  #modeSw{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;display:flex;overflow:hidden;border-radius:20px;}
  #modeSw button{background:none;border:none;color:#888;font-size:12px;letter-spacing:1.5px;padding:9px 20px;font-weight:700;}
  #modeSw button.act{background:#fff;color:#000;}
  body.sport #modeSw button.act{background:linear-gradient(90deg,#ff2d2d,#ff9500);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);}

  /* ── 搜尋 + 導航資訊（左上） ── */
  #navBar{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 48px);left:12px;z-index:1000;display:flex;gap:8px;width:min(360px,calc(100vw - 24px));}
  #navBar input{flex:1;background:rgba(14,14,16,.88);border:1px solid #2a2a2e;color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;outline:none;min-width:0;backdrop-filter:blur(8px);}
  #navBar input:focus{border-color:var(--acc1);}
  #navBar button{background:var(--acc1);border:none;color:#000;font-weight:700;border-radius:14px;padding:0 18px;font-size:14px;transition:background .4s;}
  body.sport #navBar button{color:#fff;}
  #navInfo{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 100px);left:12px;z-index:1000;width:min(360px,calc(100vw - 24px));
    background:rgba(12,12,14,.9);border:1px solid #2a2a2e;border-radius:16px;padding:13px 15px;display:none;backdrop-filter:blur(8px);}
  body.sport #navInfo{border-color:rgba(255,45,45,.35);}
  #navInfo .inst{font-size:17px;font-weight:700;margin-bottom:6px;}
  #navInfo .meta{font-size:12px;color:#9a9a9a;line-height:1.6;}
  #navInfo .meta button{background:none;border:1px solid #444;color:#bbb;border-radius:8px;padding:3px 12px;font-size:12px;margin-top:6px;}

  /* ── 右側懸浮圓形儀表 ── */
  #podWrap{position:fixed;right:calc(90px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:900;pointer-events:none;}
  #pod{position:relative;width:min(46vmin,340px);height:min(46vmin,340px);border-radius:50%;
    background:radial-gradient(100% 100% at 38% 30%,rgba(30,32,38,.93) 0%,rgba(8,9,12,.95) 68%);
    border:2px solid var(--pod-border);box-shadow:var(--pod-glow);backdrop-filter:blur(10px);
    /* 用 grid 把所有子元素(圓弧刻度SVG、光暈、中央數字)疊在同一格(grid-area:1/1)並 place-items:center
       置中。圓盤(#pod)本體就是這個容器，子元素一律以同一種機制置中→絕對同心，不可能各自跑掉。
       之前用 flex 置中.center + 絕對inset定位svg 是兩套機制，iOS 會算出略不同的中心導致刻度環偏移。 */
    display:grid;grid-template:1fr/1fr;place-items:center;transition:border-color .5s,box-shadow .5s;
    pointer-events:auto;touch-action:none;}
  #pod>*{grid-area:1/1;}
  /* 長按可拖曳搬移時速表位置 */
  body.podDragging #pod{box-shadow:0 0 0 3px var(--acc1),var(--pod-glow);transition:none;}
  body.sport.podDragging #pod{box-shadow:0 0 0 3px #ff2d2d,var(--pod-glow);}
  #podHint{position:absolute;bottom:-26px;left:0;right:0;text-align:center;font-size:11px;color:var(--acc1);
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  body.podDragging #podHint{opacity:1;}
  body.sport #pod{background:radial-gradient(100% 100% at 38% 30%,rgba(40,14,16,.94) 0%,rgba(10,4,6,.96) 68%);}
  /* 注意：不要在 <svg> 上用 CSS transform:rotate()。iOS Safari 會拿 viewBox(200) 而非
     實際渲染尺寸當旋轉基準，導致整個刻度環相對圓盤往右下位移(電腦正常、手機才歪)。
     改成把 135deg 旋轉寫進 SVG 內部的 <g transform="rotate(135 100 100)">，用 viewBox
     座標旋轉，iOS 才會乖乖同心。這裡只留純粹的 inset 定位、不放任何 transform。 */
  #pod svg{width:88%;height:88%;overflow:visible;}
  .track{fill:none;stroke:var(--track);stroke-width:9;stroke-linecap:round;transition:stroke .4s;}
  .prog{fill:none;stroke:url(#g);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .25s ease;}
  body.sport .prog{filter:drop-shadow(0 0 10px rgba(255,45,45,.9)) drop-shadow(0 0 26px rgba(255,90,0,.5));stroke-width:10;}
  #stopA{stop-color:var(--acc1);transition:stop-color .4s;}
  #stopB{stop-color:var(--acc2);transition:stop-color .4s;}
  .ticks line{stroke:#33363e;stroke-width:2;transition:stroke .4s;}
  body.sport .ticks line{stroke:#4a2026;}
  body.sport .ticks line.red{stroke:#ff2d2d;stroke-width:3;filter:drop-shadow(0 0 4px rgba(255,45,45,.9));}
  .center{display:flex;flex-direction:column;align-items:center;z-index:2;}
  #gear{display:flex;gap:14px;font-size:14px;font-weight:700;letter-spacing:2px;color:#4a4f58;margin-bottom:2px;}
  #gear span.act{color:#fff;}
  body.sport #gear span.act{color:#ff2d2d;text-shadow:0 0 10px rgba(255,45,45,.9);}
  #spd{font-size:clamp(56px,15vmin,104px);font-weight:var(--spd-weight);font-style:var(--spd-style);line-height:.95;letter-spacing:-3px;font-variant-numeric:tabular-nums;text-shadow:var(--spd-glow);transition:text-shadow .4s;}
  body.sport.redzone #spd{animation:redflash .5s infinite;}
  @keyframes redflash{0%,100%{text-shadow:0 0 18px rgba(255,45,45,.85),0 0 46px rgba(255,90,0,.5);}50%{text-shadow:0 0 30px rgba(255,30,30,1),0 0 80px rgba(255,60,0,.9);}}
  .unit{font-size:13px;color:var(--txt-sub);letter-spacing:3px;margin-top:4px;transition:color .4s;}
  #modeBadge{display:none;margin-top:7px;font-size:11px;font-weight:800;font-style:italic;letter-spacing:4px;color:#ff2d2d;
    border:1px solid #ff2d2d;border-radius:4px;padding:2px 9px 2px 13px;animation:pulse 1.4s infinite;}
  body.sport #modeBadge{display:block;}
  @keyframes pulse{0%,100%{box-shadow:0 0 5px rgba(255,45,45,.6);}50%{box-shadow:0 0 20px rgba(255,45,45,1);}}
  /* sport 時儀表外圈火焰光暈 */
  #podGlow{width:128%;height:128%;border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,transparent 58%,rgba(255,45,45,.22) 74%,transparent 92%);}
  body.sport #podGlow{opacity:1;animation:breathe 2.2s infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.05);opacity:.55;}}

  /* ── 底部懸浮列 ── */
  #bottomBar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:1000;
    display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:18px;}
  .stat{text-align:center;}
  .stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:9px;color:var(--txt-sub);margin-top:2px;letter-spacing:1px;transition:color .4s;}
  #barSpacer{flex:1;}
  #hint{font-size:12px;color:#8a8a8a;line-height:1.4;}
  #bottomBar .btn{background:#1d1d21;color:#fff;border:1px solid #333;border-radius:22px;padding:9px 18px;font-size:13px;letter-spacing:1px;}
  #bottomBar .btn:active{background:#2c2c30;}
  #bottomBar .start{background:#fff;color:#000;border:none;font-weight:700;}
  body.sport #bottomBar .start{background:linear-gradient(90deg,#ff2d2d,#ff9500);color:#fff;}
  #followBtn{position:fixed;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);z-index:1000;
    background:rgba(16,16,18,.9);border:1px solid #333;color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;display:none;backdrop-filter:blur(6px);}

  .car-marker{width:30px;height:44px;display:flex;align-items:center;justify-content:center;}
  .car-marker .arrow{width:26px;height:26px;transition:transform .3s;
    background:var(--acc1);clip-path:polygon(50% 0,90% 100%,50% 78%,10% 100%);
    filter:drop-shadow(0 0 6px rgba(79,163,255,.8));}
  /* 俯視車標(SVG)：會轉向行進方向，像 Google 導航 */
  .car-marker .vsvg{height:50px;width:auto;overflow:visible;transition:transform .3s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.55));}
  .car-marker .vsvg.nav{height:38px;}
  .car-marker .vcar{height:54px;width:auto;display:block;transition:transform .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));}
  .car-marker .vsvg .body{fill:var(--acc1);stroke:#fff;stroke-width:1.6;stroke-linejoin:round;}
  body.sport .car-marker .vsvg .body{fill:#ff2d2d;}
  .car-marker .vsvg.taxi .body{fill:#f7c331;}
  body.sport .car-marker .vsvg.taxi .body{fill:#f7c331;}
  body.sport .car-marker .arrow{background:#ff2d2d;filter:drop-shadow(0 0 8px rgba(255,45,45,.9));}

  /* 手機方向鎖定開著也要橫向：直向時把整個儀表板轉90°(force landscape)。
     iOS Safari 無法用程式強制轉螢幕，所以用 CSS 轉。#stage 被 transform 後成為內部
     fixed 元素的定位基準，整組一起轉。--lockInset 是畫面兩端留白(對應手機瀏海/home列)，
     避免控制項被切到；地圖用負 margin 補回全螢幕鋪滿。方向由 body.rotA/rotB 決定，可用翻轉鈕切。
     只在觸控裝置(pointer:coarse)生效，桌機不受影響。 */
  /* 強制橫向時，四邊留白避免撞到瀏海/狀態列/home列。用 env() 自動抓瀏海高度，
     沒瀏海的手機退回 22px。#stage 縮小後「繞中心」旋轉→四邊留白均勻、與旋轉方向無關(翻轉也安全)。 */
  :root{ --lockInset: max(env(safe-area-inset-top, 0px), 22px); }
  #stage{position:fixed;inset:0;}
  #flipBtn{display:none;}
  /* iOS Safari 對圓形/圓角元素的 backdrop-filter 毛玻璃會把「取樣的模糊底圖」畫在
     跟元素本體錯開的位置(尤其在 fixed / overflow:hidden / 旋轉的容器裡)，導致時速表
     那層深色圓盤跟數字、刻度沒對齊(看起來歪掉)。這些元素背景本身已 82~95% 不透明，
     直接關掉 backdrop-filter 外觀幾乎無差，但圓盤就會完全貼齊。全方向一律關。 */
  #pod,.pill,#navBar input,#suggest,#turnCard,#followBtn{
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  }
  @media (orientation:portrait) and (pointer:coarse){
    #stage{
      inset:auto;top:50%;left:50%;
      width:calc(100vh - 2*var(--lockInset));
      height:calc(100vw - 2*var(--lockInset));
      transform-origin:center center;
    }
    body:not(.rotB) #stage{ transform:translate(-50%,-50%) rotate(-90deg); } /* 逆時針(預設) */
    body.rotB #stage{ transform:translate(-50%,-50%) rotate(90deg); }        /* 順時針 */
    #flipBtn{
      display:flex;align-items:center;gap:6px;
      position:fixed;z-index:1200;top:10px;right:10px;
      font-size:12px;color:#ddd;padding:8px 12px;border:none;
    }
    #hint{display:none;}
  }
</style>
</head>
<body>
<div id="stage">
<div id="mapWrap"><div id="map"></div></div>
<div id="mapMsg"></div>
<div id="vignette"></div>
<div id="mapCtrls">
  <div id="zoomBtns" class="pill"><button id="zin">＋</button><button id="zout">－</button></div>
  <button id="layerBtn" class="ctrl pill" title="切換地圖風格">🗺️</button>
  <button id="tiltBtn" class="ctrl pill" title="切換 2D / 3D 視角">2D</button>
  <button id="hdgBtn" class="ctrl pill on" title="切換 車頭朝上 / 北朝上">🧭</button>
  <button id="iconBtn" class="ctrl pill" title="切換車標圖示">➤</button>
</div>
<div id="layerPanel" class="pill"></div>
<div id="iconPanel" class="pill"></div>

<div id="topLeft">
  <div class="pill" id="clock">--:--</div>
  <div class="pill" id="statusPill"><span class="dot" id="dot"></span><span id="stxt">未開始</span></div>
</div>

<div id="modeSw" class="pill">
  <button id="mNormal" class="act">NORMAL</button>
  <button id="mSport">SPORT</button>
</div>

<button id="flipBtn" class="pill" title="翻轉畫面方向（配合你的手機架擺法）">🔄 翻轉</button>

<div id="navBar">
  <input id="dest" type="text" placeholder="搜尋目的地（地址或地標）" autocomplete="off">
  <button id="navGo">導航</button>
</div>
<div id="navInfo">
  <div class="inst" id="navInst">--</div>
  <div class="meta"><span id="navMeta">--</span><br><button id="navEnd">結束導航</button></div>
</div>

<div id="podWrap">
  <div id="pod">
    <div id="podGlow"></div>
    <svg viewBox="0 0 200 200">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop id="stopA" offset="0"/><stop id="stopB" offset="1"/>
      </linearGradient></defs>
      <g transform="rotate(135 100 100)">
        <g class="ticks" id="ticks"></g>
        <circle class="track" cx="100" cy="100" r="88" stroke-dasharray="414 553"/>
        <circle class="prog" id="arc" cx="100" cy="100" r="88" stroke-dasharray="414 553" stroke-dashoffset="414"/>
      </g>
    </svg>
    <div class="center">
      <div id="gear"><span id="gP" class="act">P</span><span>R</span><span>N</span><span id="gD">D</span></div>
      <div id="spd">0</div>
      <div class="unit">KM / H</div>
      <div id="modeBadge">SPORT</div>
    </div>
    <div id="podHint">拖曳移動 · 放開儲存</div>
  </div>
</div>

<div id="bottomBar" class="pill">
  <div class="stat"><div class="v" id="mx">0</div><div class="l">最高 KM/H</div></div>
  <div class="stat"><div class="v" id="dist">0.0</div><div class="l">距離 KM</div></div>
  <div class="stat"><div class="v" id="alt">--</div><div class="l">海拔 M</div></div>
  <div class="stat"><div class="v" id="dir">--</div><div class="l">方向</div></div>
  <div id="barSpacer"></div>
  <div id="hint">按「開始」允許定位即變儀表板 🚗</div>
  <button class="btn start" id="go">開始</button>
  <button class="btn" id="reset">歸零</button>
  <button class="btn" id="demo">模擬</button>
  <span style="font-size:9px;color:#556;margin-left:4px" id="mapCredit">© OpenFreeMap · OSM · v21</span>
</div>
<button id="followBtn" title="回到目前位置">◎</button>
</div><!-- /#stage -->

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const MAXSPD=180, ARC=414;
const $=id=>document.getElementById(id);
let wId=null, maxS=0, dist=0, lastLat=null, lastLon=null, lastT=null;
let curLat=25.0330, curLon=121.5654, curHead=0; // 預設台北101，取得定位後更新

/* ── 時鐘 ── */
function clk(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
setInterval(clk,1000);clk();

/* ── 儀表刻度 ── */
(function makeTicks(){
  const g=$('ticks'), R1=94, R2=100, cx=100, cy=100;
  for(let i=0;i<=36;i++){ // 每5km/h一格
    const frac=i/36, ang=(frac*270)*Math.PI/180;
    const major=i%2===0;
    const r1=major?R1-2:R1;
    const x1=cx+r1*Math.cos(ang), y1=cy+r1*Math.sin(ang);
    const x2=cx+R2*Math.cos(ang), y2=cy+R2*Math.sin(ang);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    if(frac>=0.67)l.setAttribute('class','red'); // 120km/h 以上紅區
    g.appendChild(l);
  }
})();

/* ── 長按拖曳搬移時速表(位置存 localStorage) ── */
(function podDrag(){
  const w=$('podWrap'), pod=$('pod'), stage=$('stage');
  let converted=false, dragging=false, lpTimer=null, sx0=0, sy0=0, lx0=0, ly0=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  // 目前 #stage 的旋轉角度(強制橫向時 ±90，其餘 0)——把螢幕位移換算成 stage 內部座標
  function stageRot(){
    if(!matchMedia('(orientation:portrait) and (pointer:coarse)').matches) return 0;
    return document.body.classList.contains('rotB') ? 90 : -90;
  }
  const size=()=>({W:stage.offsetWidth,H:stage.offsetHeight,Pw:w.offsetWidth,Ph:w.offsetHeight});
  // 把預設的 right/top:50%/translateY 定位換算成明確 left/top(offset* 不受祖先 transform 影響)
  function convert(){
    if(converted) return;
    const left=w.offsetLeft, top=w.offsetTop - w.offsetHeight/2; // 補回被移除的 translateY(-50%)
    w.style.right='auto'; w.style.bottom='auto'; w.style.transform='none';
    w.style.left=left+'px'; w.style.top=top+'px';
    converted=true;
  }
  function applyFrac(fx,fy){
    const {W,H,Pw,Ph}=size();
    w.style.right='auto'; w.style.bottom='auto'; w.style.transform='none';
    w.style.left=clamp(fx*(W-Pw),0,Math.max(0,W-Pw))+'px';
    w.style.top =clamp(fy*(H-Ph),0,Math.max(0,H-Ph))+'px';
    converted=true;
  }
  function save(){
    const {W,H,Pw,Ph}=size();
    localStorage.setItem('podPos',JSON.stringify({
      fx:(parseFloat(w.style.left)||0)/Math.max(1,W-Pw),
      fy:(parseFloat(w.style.top)||0)/Math.max(1,H-Ph)
    }));
  }
  function startDrag(){
    convert(); dragging=true; document.body.classList.add('podDragging');
    lx0=parseFloat(w.style.left)||0; ly0=parseFloat(w.style.top)||0;
    if(navigator.vibrate) navigator.vibrate(15);
  }
  function endDrag(){ if(!dragging)return; dragging=false; document.body.classList.remove('podDragging'); save(); }
  pod.addEventListener('pointerdown',e=>{
    sx0=e.clientX; sy0=e.clientY;
    lpTimer=setTimeout(startDrag,450);
    try{pod.setPointerCapture(e.pointerId);}catch(_){}
  });
  pod.addEventListener('pointermove',e=>{
    if(!dragging){ if(Math.hypot(e.clientX-sx0,e.clientY-sy0)>10) clearTimeout(lpTimer); return; }
    e.preventDefault();
    const dsx=e.clientX-sx0, dsy=e.clientY-sy0, r=stageRot();
    let dlx,dly;
    if(r===0){dlx=dsx;dly=dsy;} else if(r===90){dlx=dsy;dly=-dsx;} else {dlx=-dsy;dly=dsx;}
    const {W,H,Pw,Ph}=size();
    w.style.left=clamp(lx0+dlx,0,Math.max(0,W-Pw))+'px';
    w.style.top =clamp(ly0+dly,0,Math.max(0,H-Ph))+'px';
  });
  const up=()=>{ clearTimeout(lpTimer); endDrag(); };
  pod.addEventListener('pointerup',up);
  pod.addEventListener('pointercancel',up);
  // 載入已存位置(等一幀讓版面穩定)
  let saved=null; try{saved=JSON.parse(localStorage.getItem('podPos'));}catch(_){}
  if(saved && typeof saved.fx==='number') requestAnimationFrame(()=>applyFrac(saved.fx,saved.fy));
  // 旋轉/改尺寸後用比例重新定位，避免時速表跑出畫面
  addEventListener('resize',()=>{ let s=null; try{s=JSON.parse(localStorage.getItem('podPos'));}catch(_){}
    if(s && typeof s.fx==='number') applyFrac(s.fx,s.fy); });
})();

/* ── 模式切換 ── */
function setMode(sport){
  document.body.classList.toggle('sport',sport);
  $('mSport').classList.toggle('act',sport);
  $('mNormal').classList.toggle('act',!sport);
  $('gD').textContent=sport?'S':'D';
  if(map&&map.getLayer('route-line'))map.setPaintProperty('route-line','line-color',sport?'#ff2d2d':'#4fa3ff');
  localStorage.setItem('dashMode',sport?'sport':'normal');
}
$('mNormal').onclick=()=>setMode(false);
$('mSport').onclick=()=>setMode(true);

/* ── 速度顯示 ── */
const dirTxt=b=>{const a=['北','東北','東','東南','南','西南','西','西北'];return a[Math.round(b/45)%8];};
function setSpd(kmh){
  kmh=Math.max(0,kmh);
  $('spd').textContent=Math.round(kmh);
  $('arc').style.strokeDashoffset=ARC-Math.min(kmh/MAXSPD,1)*ARC;
  if(kmh>maxS){maxS=kmh;$('mx').textContent=Math.round(maxS);}
  document.body.classList.toggle('redzone',kmh>=120);
  const moving=kmh>=2;
  $('gP').classList.toggle('act',!moving);
  $('gD').classList.toggle('act',moving);
}
function haversine(la1,lo1,la2,lo2){const R=6371000,toR=x=>x*Math.PI/180;const dLa=toR(la2-la1),dLo=toR(lo2-lo1);const a=Math.sin(dLa/2)**2+Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
function bearing(la1,lo1,la2,lo2){const toR=x=>x*Math.PI/180,toD=x=>x*180/Math.PI;
  const y=Math.sin(toR(lo2-lo1))*Math.cos(toR(la2));
  const x=Math.cos(toR(la1))*Math.sin(toR(la2))-Math.sin(toR(la1))*Math.cos(toR(la2))*Math.cos(toR(lo2-lo1));
  return (toD(Math.atan2(y,x))+360)%360;}

/* ── 位置更新 ── */
function updatePosition(lat,lon,kmh,alt,head,ts){
  if(lastLat!=null){
    const step=haversine(lastLat,lastLon,lat,lon);
    if(step<2000)dist+=step/1000; // 一步跳超過2km視為換來源/瞬移，不累計
    $('dist').textContent=dist.toFixed(1);
  }
  lastLat=lat;lastLon=lon;lastT=ts;
  curLat=lat;curLon=lon;
  if(kmh!=null)setSpd(kmh);
  if(alt!=null)$('alt').textContent=Math.round(alt);
  if(head!=null&&!isNaN(head)){curHead=head;$('dir').textContent=dirTxt(head);}
  mapTick();
  navTick();
}
function resetTrack(){lastLat=null;lastLon=null;lastT=null;} // 切換 GPS/模擬 前呼叫，避免瞬移灌爆速度與距離
function onPos(p){
  $('dot').className='dot on';$('stxt').textContent='GPS';
  const c=p.coords;
  let kmh=c.speed!=null&&c.speed>=0?c.speed*3.6:null;
  if(kmh==null&&lastLat!=null&&lastT!=null){
    const d=haversine(lastLat,lastLon,c.latitude,c.longitude),dt=(p.timestamp-lastT)/1000;
    if(dt>0)kmh=(d/dt)*3.6;
    if(kmh!=null&&kmh>250)kmh=null; // 位置跳動算出的不合理速度直接丟棄
  }
  updatePosition(c.latitude,c.longitude,kmh,c.altitude,c.heading,p.timestamp);
}
let geoAlerted=false;
function onErr(e){
  $('dot').className='dot err';$('stxt').textContent='定位失敗（請允許權限）';
  $('go').textContent='開始';
  if(wId){navigator.geolocation.clearWatch(wId);wId=null;}
}
function startGPS(){
  if(wId)return;
  if(!navigator.geolocation){$('stxt').textContent='此裝置不支援定位';return;}
  stopDemo(); resetTrack();
  $('hint').style.display='none';$('go').textContent='停止';$('stxt').textContent='搜尋衛星…';
  wId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
function stopGPS(){
  if(wId){navigator.geolocation.clearWatch(wId);wId=null;}
  $('dot').className='dot';$('stxt').textContent='已停止';$('go').textContent='開始';
}
$('go').onclick=()=>{ if(wId)stopGPS(); else startGPS(); };
$('reset').onclick=()=>{maxS=0;dist=0;lastLat=null;$('mx').textContent='0';$('dist').textContent='0.0';setSpd(0);};

/* ── 模擬模式（有導航路線時沿路線開） ── */
let demoT=null,demoDist=0,demoClock=0;
function stopDemo(){if(demoT){clearInterval(demoT);demoT=null;$('demo').textContent='模擬';}}
$('demo').onclick=()=>{
  if(demoT){stopDemo();$('stxt').textContent='已停止';$('dot').className='dot';return;}
  if(wId){navigator.geolocation.clearWatch(wId);wId=null;$('go').textContent='開始';}
  resetTrack();
  $('hint').style.display='none';$('demo').textContent='停止模擬';
  $('dot').className='dot on';$('stxt').textContent='模擬中';
  demoDist=0;demoClock=0;
  demoT=setInterval(()=>{
    demoClock+=0.4;
    const kmh=60+55*Math.sin(demoClock/6)+18*Math.sin(demoClock/1.7);
    let lat,lon,head=curHead;
    if(route&&route.coords.length>1){
      demoDist+=Math.max(kmh,5)/3.6*0.4;
      const p=pointAlongRoute(demoDist);
      lat=p.lat;lon=p.lon;head=p.head;
      if(demoDist>=route.total){stopDemo();$('stxt').textContent='已到達';}
    }else{
      lat=curLat+0.0004*Math.sin(demoClock/5);lon=curLon+0.0004*Math.cos(demoClock/5);
      head=(demoClock*12)%360;
    }
    updatePosition(lat,lon,Math.max(kmh,0),15,head,Date.now());
  },400);
};

/* ── 地圖 ── */
let map=null,carEl=null,carMarker=null,destMarker=null,follow=true,styleReady=false;
let headingUp=localStorage.getItem('headingUp')!=='0'; // 預設車頭朝上
let is3D=localStorage.getItem('map3D')==='1';           // 3D 立體(pitch 傾斜 + 建築 fill-extrusion)
const PITCH_3D=55;
function apply3D(){
  const b=$('tiltBtn'); if(b){ b.textContent=is3D?'3D':'2D'; b.classList.toggle('on',is3D); }
  if(map) map.easeTo({pitch:is3D?PITCH_3D:0,duration:500});
}
// 換風格/初次載入後：補上 3D 建築與路線圖層(setStyle 會清掉自訂圖層，要重加)
function ensure3DBuildings(){
  if(!map.getSource('openmaptiles')) return;   // 衛星等無向量源→沒有立體建築
  if(map.getLayer('building-3d')) return;        // liberty 已內建，不重複
  const s=styleObjFor(mapStyle); if(!s.bld) return;
  let before; for(const l of map.getStyle().layers){ if(l.type==='symbol'){before=l.id;break;} }
  map.addLayer({id:'building-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,
    paint:{'fill-extrusion-color':s.bld,
      'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],5],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
      'fill-extrusion-opacity':.9}},before);
}
function ensureRouteLayer(){
  if(!map.getSource('route')) map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  if(!map.getLayer('route-line')) map.addLayer({id:'route-line',type:'line',source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':document.body.classList.contains('sport')?'#ff2d2d':'#4fa3ff','line-width':6,'line-opacity':.85}});
}
function onStyleReady(){ ensure3DBuildings(); ensureRouteLayer(); if(route) drawRoute(false); }
// 可靠等待 style 載入完(style.load/styledata 事件在 setStyle 後時機不穩，直接輪詢 isStyleLoaded)
function whenStyleLoaded(cb){
  if(!map) return;
  if(map.isStyleLoaded()){ cb(); return; }
  const t=setInterval(()=>{ if(map&&map.isStyleLoaded()){ clearInterval(t); cb(); } },120);
}
function drawRoute(fit){
  if(!map||!route)return;
  const line={type:'Feature',geometry:{type:'LineString',coordinates:route.coords.map(c=>[c.lon,c.lat])}};
  ensureRouteLayer();
  const src=map.getSource('route'); if(src)src.setData(line);
  if(destMarker)destMarker.remove();
  destMarker=new maplibregl.Marker({color:document.body.classList.contains('sport')?'#ff2d2d':'#4fa3ff'})
    .setLngLat([route.dest.lon,route.dest.lat]).addTo(map);
  if(fit){
    const bb=new maplibregl.LngLatBounds();
    route.coords.forEach(c=>bb.extend([c.lon,c.lat]));
    follow=false;$('followBtn').style.display='block';
    map.fitBounds(bb,{padding:60,bearing:0,pitch:is3D?40:0,duration:800});
  }
}
/* 地圖風格：OpenFreeMap 向量圖(免金鑰、含建物資料可做 3D)，衛星用 Esri raster 自組 style */
const SAT_STYLE={version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256}},
  layers:[{id:'sat',type:'raster',source:'sat'}]};
const MAP_STYLES=[
  {k:'dark',    n:'🌑 深色 3D',   style:'https://tiles.openfreemap.org/styles/dark',    a:'© OpenFreeMap · OSM', bld:'#2a2e37'},
  {k:'liberty', n:'🏙️ 街道 3D',   style:'https://tiles.openfreemap.org/styles/liberty', a:'© OpenFreeMap · OSM', bld:null}, // liberty 內建 building-3d
  {k:'positron',n:'🌕 淺色乾淨',  style:'https://tiles.openfreemap.org/styles/positron',a:'© OpenFreeMap · OSM', bld:'#c9cdd6'},
  {k:'sat',     n:'🛰️ 衛星空拍',  style:SAT_STYLE,                                      a:'© Esri',              bld:null},
];
const APP_VER='v21';
let mapStyle=localStorage.getItem('mapStyle')||'dark';
function styleObjFor(k){ return MAP_STYLES.find(x=>x.k===k)||MAP_STYLES[0]; }
function setMapStyle(k){
  const s=styleObjFor(k);
  mapStyle=s.k; localStorage.setItem('mapStyle',s.k);
  const cr=$('mapCredit'); if(cr) cr.textContent=s.a+' · '+APP_VER;
  document.querySelectorAll('#layerPanel button').forEach(b=>b.classList.toggle('act',b.dataset.k===s.k));
  if(map){ map.setStyle(s.style,{diff:false}); map.once('idle',onStyleReady); }  // 換風格後(新style渲染完)重加建築+路線
}
(function buildLayerPanel(){
  const panel=$('layerPanel');
  MAP_STYLES.forEach(s=>{
    const b=document.createElement('button'); b.textContent=s.n; b.dataset.k=s.k;
    b.onclick=()=>{ setMapStyle(s.k); panel.classList.remove('open'); };
    panel.appendChild(b);
  });
  $('layerBtn').onclick=e=>{ e.stopPropagation(); $('iconPanel').classList.remove('open'); panel.classList.toggle('open'); };
  document.addEventListener('pointerdown',e=>{ if(!panel.contains(e.target)&&e.target!==$('layerBtn')) panel.classList.remove('open'); });
})();
$('tiltBtn').onclick=()=>{ is3D=!is3D; localStorage.setItem('map3D',is3D?'1':'0'); apply3D(); };

/* ── 車標圖示(可自選：導航箭頭/汽車/機車…，存 localStorage)。SVG 皆俯視、車頭朝上(0°) ── */
// 乾淨的導航指標(像 Google/Apple 地圖的方向箭頭)
function NAV_SVG(){return '<svg class="vsvg nav" viewBox="0 0 36 40">'
  +'<path class="body" d="M18 1.5c1 0 1.8.6 2.4 1.9L32.5 34c1 2.8-1.9 5.2-4.7 4L18 33.8 8.2 38c-2.8 1.2-5.7-1.2-4.7-4L15.6 3.4C16.2 2.1 17 1.5 18 1.5z"/>'
  +'<path d="M18 6l8.5 23q-8.5-3.6-17 0z" fill="rgba(255,255,255,.25)"/></svg>';}
function CAR_SVG(cls){return '<svg class="vsvg'+cls+'" viewBox="0 0 40 74">'
  +'<rect x="1.5" y="15" width="6" height="13" rx="3" fill="#181818"/><rect x="32.5" y="15" width="6" height="13" rx="3" fill="#181818"/>'
  +'<rect x="1.5" y="47" width="6" height="13" rx="3" fill="#181818"/><rect x="32.5" y="47" width="6" height="13" rx="3" fill="#181818"/>'
  +'<path class="body" d="M5 23l4.5 1.2v3.4L5 28.8z"/><path class="body" d="M35 23l-4.5 1.2v3.4L35 28.8z"/>'
  +'<path class="body" d="M20 1C11.5 1 7 7 7 18v38c0 11 4.5 17 13 17s13-6 13-17V18C33 7 28.5 1 20 1z"/>'
  +'<path d="M11.5 19Q20 14.5 28.5 19L26.5 30h-13z" fill="#d6e8ff"/>'
  +'<rect x="12.5" y="31.5" width="15" height="17" rx="4" fill="rgba(255,255,255,.16)"/>'
  +'<path d="M13.5 49h13l1.5 9Q20 62 12 58z" fill="#bcd6f5"/>'
  +'<circle cx="12" cy="8.5" r="1.9" fill="#fff4c8"/><circle cx="28" cy="8.5" r="1.9" fill="#fff4c8"/></svg>';}
function MOTO_SVG(){return '<svg class="vsvg" viewBox="0 0 26 70">'
  +'<rect x="10" y="3" width="6" height="15" rx="3" fill="#181818"/><rect x="10" y="52" width="6" height="15" rx="3" fill="#181818"/>'
  +'<rect class="body" x="3" y="18" width="20" height="4.5" rx="2.2"/>'
  +'<path class="body" d="M13 12c-3.5 0-5 3-5 10v24c0 7 1.5 10 5 10s5-3 5-10V22c0-7-1.5-10-5-10z"/>'
  +'<rect x="9.5" y="30" width="7" height="16" rx="3.5" fill="rgba(0,0,0,.3)"/></svg>';}
function TRUCK_SVG(){return '<svg class="vsvg" viewBox="0 0 40 86">'
  +'<rect x="2" y="16" width="6" height="13" rx="3" fill="#181818"/><rect x="32" y="16" width="6" height="13" rx="3" fill="#181818"/>'
  +'<rect x="2" y="58" width="6" height="13" rx="3" fill="#181818"/><rect x="32" y="58" width="6" height="13" rx="3" fill="#181818"/>'
  +'<rect class="body" x="7" y="24" width="26" height="60" rx="4"/><rect class="body" x="8.5" y="2" width="23" height="26" rx="5"/>'
  +'<path d="M11 6Q20 3.5 29 6L27.5 13h-15z" fill="#d6e8ff"/>'
  +'<rect x="9" y="30" width="22" height="50" rx="2" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.4"/>'
  +'<line x1="20" y1="30" x2="20" y2="80" stroke="rgba(255,255,255,.18)" stroke-width="1.2"/></svg>';}
// 真實俯視車圖(CC0, Unlucky Studio 渲染圖，非手繪)：front 朝上(0°)，隨行進方向旋轉
const CAR_ICONS=[
  {k:'audi',     n:'紅色轎跑',g:'🚗', img:'audi',      rot:true},
  {k:'viper',    n:'黑色跑車',g:'🏎️', img:'viper',     rot:true},
  {k:'orange',   n:'橘色轎車',g:'🚙', img:'orange',    rot:true},
  {k:'pickup',   n:'藍色貨卡',g:'🛻', img:'pickup',    rot:true},
  {k:'van',      n:'白色廂型車',g:'🚐', img:'van',      rot:true},
  {k:'taxi',     n:'計程車',  g:'🚕', img:'taxi',      rot:true},
  {k:'police',   n:'警車',    g:'🚓', img:'police',    rot:true},
  {k:'truck',    n:'大貨車',  g:'🚚', img:'truck',     rot:true},
  {k:'ambulance',n:'救護車',  g:'🚑', img:'ambulance', rot:true},
  {k:'nav',      n:'導航箭頭',g:'➤',  html:NAV_SVG(),  rot:true},
  {k:'dot',      n:'圓點',    g:'🔵', html:'<svg class="vsvg" viewBox="0 0 26 26" style="height:26px;width:26px"><circle cx="13" cy="13" r="7.5" class="body"/><circle cx="13" cy="13" r="3" fill="#fff"/></svg>', rot:false},
];
let carIcon=localStorage.getItem('carIcon')||'audi';
function iconObj(){ return CAR_ICONS.find(x=>x.k===carIcon)||CAR_ICONS[0]; }
function iconHtml(){ const o=iconObj(); return o.img?('<img class="vcar" src="icons/car_'+o.img+'.png" alt="">'):o.html; }
function setCarIcon(k){
  carIcon=k; localStorage.setItem('carIcon',k);
  if(carEl) carEl.innerHTML=iconHtml();
  const ib=$('iconBtn'); if(ib) ib.textContent=iconObj().g;
  document.querySelectorAll('#iconPanel button[data-k]').forEach(b=>b.classList.toggle('act',b.dataset.k===k));
  mapTick(false);
}
(function buildIconPanel(){
  const panel=$('iconPanel');
  CAR_ICONS.forEach(s=>{
    const b=document.createElement('button'); b.textContent=s.g+'　'+s.n; b.dataset.k=s.k;
    b.onclick=()=>{ setCarIcon(s.k); panel.classList.remove('open'); };
    panel.appendChild(b);
  });
  $('iconBtn').onclick=e=>{ e.stopPropagation(); $('layerPanel').classList.remove('open'); panel.classList.toggle('open'); };
  document.addEventListener('pointerdown',e=>{ if(!panel.contains(e.target)&&e.target!==$('iconBtn')) panel.classList.remove('open'); });
})();
try{
  const s0=styleObjFor(mapStyle);
  $('mapCredit').textContent=s0.a+' · '+APP_VER;
  document.querySelectorAll('#layerPanel button').forEach(b=>b.classList.toggle('act',b.dataset.k===s0.k));
  map=new maplibregl.Map({container:'map',style:s0.style,center:[curLon,curLat],zoom:16,
    pitch:is3D?PITCH_3D:0,bearing:0,attributionControl:false,dragRotate:true,pitchWithRotate:true,maxPitch:70});
  carEl=document.createElement('div'); carEl.className='car-marker'; carEl.innerHTML=iconHtml();
  carMarker=new maplibregl.Marker({element:carEl,rotationAlignment:'viewport'}).setLngLat([curLon,curLat]).addTo(map);
  whenStyleLoaded(onStyleReady);  // 初次載入補上 3D 建築 + 路線圖層
  // 只有「使用者」操作(有 originalEvent)才取消跟隨；程式自己 easeTo 轉向不算，否則車頭朝上會秒關跟隨
  const userMove=e=>{ if(e && e.originalEvent){ follow=false; $('followBtn').style.display='block'; } };
  map.on('dragstart',userMove);
  map.on('rotatestart',userMove);
  map.on('pitchstart',userMove);
}catch(e){
  $('mapMsg').style.display='flex';
  $('mapMsg').textContent='地圖載入失敗（需要網路連線）';
}
apply3D();
setCarIcon(carIcon);   // 套用已存車標 + 同步按鈕/面板狀態
$('zin').onclick=()=>{if(map)map.zoomIn();};
$('zout').onclick=()=>{if(map)map.zoomOut();};
$('followBtn').onclick=()=>{follow=true;$('followBtn').style.display='none';mapTick(true);};
function refreshHdgBtn(){
  $('hdgBtn').textContent='🧭';
  $('hdgBtn').title=headingUp?'車頭朝上（點擊改北朝上）':'北朝上（點擊改車頭朝上）';
  $('hdgBtn').classList.toggle('on',headingUp);
}
$('hdgBtn').onclick=()=>{
  headingUp=!headingUp;
  localStorage.setItem('headingUp',headingUp?'1':'0');
  refreshHdgBtn();
  mapTick(true);
};
refreshHdgBtn();
function mapTick(recenter){
  if(!map)return;
  if(carMarker)carMarker.setLngLat([curLon,curLat]);
  // 車頭朝上＝地圖 bearing 轉成 curHead(前方朝上)；箭頭在畫面上指行進方向(curHead - bearing)
  const b=(headingUp&&follow)?curHead:0;
  // 箭頭指行進方向(curHead-bearing 隨地圖轉)；emoji 車標維持正立(車頭朝上時上=前方)
  const inner=carEl&&carEl.firstElementChild;
  if(inner)inner.style.transform=iconObj().rot?('rotate('+((curHead-b+360)%360)+'deg)'):'none';
  if(follow)map.easeTo({center:[curLon,curLat],bearing:b,duration:recenter?600:900});
}

/* ── 導航（Nominatim 搜尋 + OSRM 路線） ── */
let route=null,stepIdx=0;
const MANEUVER={'turn-left':'↰ 左轉','turn-right':'↱ 右轉','turn-slight left':'↖ 靠左','turn-slight right':'↗ 靠右',
  'turn-sharp left':'⬅ 急左轉','turn-sharp right':'➡ 急右轉','turn-uturn':'⟲ 迴轉','turn-straight':'↑ 直行',
  'depart':'🚗 出發','arrive':'🏁 到達目的地','merge':'⇗ 匯入','on ramp':'⇗ 上匝道','off ramp':'⇘ 下匝道',
  'fork-left':'↖ 岔路靠左','fork-right':'↗ 岔路靠右','roundabout':'◯ 進入圓環','exit roundabout':'◯ 離開圓環',
  'new name':'↑ 繼續直行','continue':'↑ 繼續直行','end of road-left':'↰ 路底左轉','end of road-right':'↱ 路底右轉'};
function stepText(s){
  let t=MANEUVER[s.maneuver.type+'-'+(s.maneuver.modifier||'')]||MANEUVER[s.maneuver.type]||'↑ 前進';
  if(s.name)t+='　'+s.name;
  return t;
}
// 地理編碼：先用 Photon(komoot，模糊搜尋佳、帶座標偏好)，找不到再退回 Nominatim(帶當地 viewbox)
async function geocode(q){
  try{
    const u='https://photon.komoot.io/api/?limit=6&lang=default&lat='+curLat+'&lon='+curLon+'&q='+encodeURIComponent(q);
    const r=await fetch(u).then(x=>x.json());
    if(r&&r.features&&r.features.length){
      const f=r.features[0],c=f.geometry.coordinates,p=f.properties||{};
      const name=p.name||[p.street,p.district,p.city].filter(Boolean).join(' ')||q;
      return {lat:c[1],lon:c[0],name};
    }
  }catch(_){}
  try{
    const d=0.7,vb=(curLon-d)+','+(curLat+d)+','+(curLon+d)+','+(curLat-d);
    const u='https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=zh-TW&viewbox='+vb+'&q='+encodeURIComponent(q);
    const r=await fetch(u,{headers:{'Accept-Language':'zh-TW'}}).then(x=>x.json());
    if(r&&r.length) return {lat:+r[0].lat,lon:+r[0].lon,name:r[0].display_name.split(',')[0]};
  }catch(_){}
  return null;
}
async function doNav(){
  const q=$('dest').value.trim();
  if(!q)return;
  $('navGo').textContent='…';
  try{
    const g=await geocode(q);
    if(!g){alert('找不到「'+q+'」\n試試：換關鍵字、加上城市名(例：台南 聖母廟)、或用更完整的地址');$('navGo').textContent='導航';return;}
    const dLat=g.lat,dLon=g.lon;
    const res=await fetch('https://router.project-osrm.org/route/v1/driving/'+curLon+','+curLat+';'+dLon+','+dLat+'?overview=full&geometries=geojson&steps=true').then(r=>r.json());
    if(res.code!=='Ok'||!res.routes.length){alert('規劃路線失敗，請稍後再試');$('navGo').textContent='導航';return;}
    const r=res.routes[0];
    const coords=r.geometry.coordinates.map(c=>({lat:c[1],lon:c[0]}));
    let acc=0;const cum=[0];
    for(let i=1;i<coords.length;i++){acc+=haversine(coords[i-1].lat,coords[i-1].lon,coords[i].lat,coords[i].lon);cum.push(acc);}
    route={coords,cum,total:acc,steps:r.legs[0].steps,duration:r.duration,distance:r.distance,dest:{lat:dLat,lon:dLon,name:g.name}};
    stepIdx=0;
    drawRoute(true);
    $('navInfo').style.display='block';
    navTick();
  }catch(e){alert('導航服務連線失敗（需要網路）：'+e.message);}
  $('navGo').textContent='導航';
}
$('navGo').onclick=doNav;
$('dest').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doNav();}});
$('navEnd').onclick=()=>{
  route=null;$('navInfo').style.display='none';
  if(map&&map.getSource('route'))map.getSource('route').setData({type:'FeatureCollection',features:[]});
  if(destMarker){destMarker.remove();destMarker=null;}
};
function pointAlongRoute(d){
  const {coords,cum}=route;
  if(d>=route.total){const p=coords[coords.length-1];return{lat:p.lat,lon:p.lon,head:curHead};}
  let i=1;while(i<cum.length&&cum[i]<d)i++;
  const f=(d-cum[i-1])/((cum[i]-cum[i-1])||1);
  const a=coords[i-1],b=coords[i];
  return{lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f,head:bearing(a.lat,a.lon,b.lat,b.lon)};
}
function fmtDur(s){const m=Math.round(s/60);return m<60?m+' 分鐘':Math.floor(m/60)+' 小時 '+(m%60)+' 分';}
function navTick(){
  if(!route)return;
  while(stepIdx<route.steps.length-1){
    const loc=route.steps[stepIdx].maneuver.location;
    if(haversine(curLat,curLon,loc[1],loc[0])<30)stepIdx++;
    else break;
  }
  const s=route.steps[stepIdx];
  const loc=s.maneuver.location;
  const dToStep=haversine(curLat,curLon,loc[1],loc[0]);
  const remain=haversine(curLat,curLon,route.dest.lat,route.dest.lon);
  $('navInst').textContent=(dToStep>40?Math.round(dToStep)+' m 後　':'')+stepText(s);
  $('navMeta').textContent='剩餘約 '+(remain/1000).toFixed(1)+' km｜全程 '+(route.distance/1000).toFixed(1)+' km · '+fmtDur(route.duration)+'｜→ '+route.dest.name;
  if(remain<40){$('navInst').textContent='🏁 已到達 '+route.dest.name;}
}

/* ── 螢幕恆亮 ── */
let wl=null;async function keepAwake(){try{wl=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(wl!==null&&document.visibilityState==='visible')keepAwake();});
$('go').addEventListener('click',keepAwake,{once:true});
$('demo').addEventListener('click',keepAwake,{once:true});

if(localStorage.getItem('dashMode')==='sport')setMode(true);

// 強制橫向的翻轉方向（配合手機架擺法，避免上下顛倒），記在 localStorage
if(localStorage.getItem('rotDir')==='B')document.body.classList.add('rotB');
$('flipBtn').addEventListener('click',()=>{
  document.body.classList.toggle('rotB');
  localStorage.setItem('rotDir',document.body.classList.contains('rotB')?'B':'A');
  setTimeout(relayoutMap,350);
});

// 轉向/改變視窗大小後，#stage 尺寸會變，MapLibre 要重新量一次才不會破圖
function relayoutMap(){ if(map){ map.resize(); if(follow) map.easeTo({center:[curLon,curLat]}); } }
window.addEventListener('resize',()=>setTimeout(relayoutMap,300));
window.addEventListener('orientationchange',()=>setTimeout(relayoutMap,400));
setTimeout(relayoutMap,500); // 初次載入若在強制橫向，地圖需重量一次

// 開啟網站就自動定位(不用等按開始)。需要 HTTPS + 使用者允許權限。
startGPS();
</script>
